/* ---- Versão operacional: login, formulários e estados ---- */
#auth{display:none}
body.auth #auth{display:grid;place-items:center;min-height:100vh;padding:24px}
body.auth .sidebar,body.auth .shell{display:none}
.auth-card{background:#fffdf9;border:1px solid var(--border);border-radius:20px;padding:38px 34px;width:min(420px,100%);box-shadow:0 20px 60px #263b3812}
.auth-card .brand{margin-bottom:30px}
.auth-card h1{font-size:26px;margin-bottom:6px}
.auth-card .subtitle{margin-bottom:24px}
.auth-card .button{width:100%;justify-content:center;margin-top:6px}
.auth-card .form-actions .button{width:auto}
.form-error{color:#a53d35;font-size:12px;min-height:16px;margin:4px 0 10px;font-weight:600}
.form-error:empty{min-height:0;margin:0}
.check-field{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;margin:0 0 12px;cursor:pointer}
.check-field input{width:16px;height:16px;accent-color:var(--teal)}
fieldset.field.multi{border:1px solid #dce1d7;border-radius:8px;padding:10px 12px 2px}
fieldset.field.multi legend{padding:0 4px}
.form-dialog{width:min(640px,95vw)}
.form-body h3{font-size:13px;margin:8px 0 14px;color:var(--teal-dark);letter-spacing:.3px}
.form-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kit-row{display:grid;grid-template-columns:1.1fr 1fr 1.3fr .7fr .8fr;gap:8px;border-bottom:1px dashed var(--border);margin-bottom:12px}
.kit-row .field{margin-bottom:10px;font-size:10px}
.kit-row .field input,.kit-row .field select{padding:8px}
.checklist{list-style:none;padding:0;margin:14px 0;font-size:12px;line-height:2;color:var(--muted)}
.checklist li.done{color:var(--teal-dark);font-weight:600}
.text-link{color:var(--teal-dark);text-decoration:underline;text-underline-offset:2px;font-size:12px}
.info-box{margin-bottom:18px}
.info-box h4,.dialog-body h4{font-size:12px;margin:20px 0 10px;color:var(--teal-dark)}
tr.inactive,.panel.inactive{opacity:.55}
.danger{color:#a53d35!important}
.sync{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal)}
body.busy .sync::before{background:var(--orange);animation:pulse 1s infinite}
body.busy{cursor:progress}

  <script>'use strict';
(() => {
/* ================================================================
   CRM Alicerces — versão operacional (ligada ao Apps Script)
   ================================================================ */
const API_URL = (new URLSearchParams(location.search).get('api')) || window.CRM_API_URL || '';
const TOKEN_KEY = 'crm-alicerces-sessao';

/* ---------- Status que não estão na aba LISTAS ---------- */
const ST = {
  escola: ['Prospecção', 'Cliente', 'Não avançou', 'Inativa'],
  tarefa: ['Aberta', 'Concluída', 'Cancelada'],
  prioridade: ['Alta', 'Normal', 'Baixa'],
  demanda: ['Aberta', 'Em andamento', 'Concluída'],
  contratacao: ['Em andamento', 'Concluída', 'Cancelada'],
  contrato: ['Vigente', 'Encerrado', 'Rescindido'],
  anoLetivo: ['Ativo', 'Encerrado'],
  renovacao: ['Aberta', 'Em negociação', 'Renovada', 'Não renovada'],
  pedagogico: ['Agendado', 'Realizado', 'Cancelado'],
  documento: ['Pendente', 'Recebido', 'Aprovado'],
  perfil: ['Gestor', 'Operacional']
};
const ETAPAS_CONTRATACAO = [
  ['DATA_DOCUMENTOS_RECEBIDOS', 'Documentos recebidos'], ['DATA_KITS_RECEBIDOS', 'Definição de kits recebida'],
  ['DATA_DOCS_ENVIADOS_APROVACAO', 'Documentos enviados para aprovação'], ['DATA_APROVACAO_CLIENTE', 'Aprovação do cliente'],
  ['DATA_ENVIO_ASSINATURA', 'Enviado para assinatura'], ['DATA_ASSINATURA_CLIENTE', 'Assinado pelo cliente'],
  ['DATA_ASSINATURA_EQUIPE', 'Assinado pela Alicerces']
];
const TABS = ['Visão geral', 'Contatos', 'Tentativas e atividades', 'Reuniões', 'Comercial', 'Contratos', 'Pedagógico', 'Demandas', 'Histórico'];
const NAV = [['inicio', 'Início', 'home'], ['prospeccao', 'Prospecção', 'columns'], ['clientes', 'Clientes', 'building'], ['agenda', 'Agenda', 'calendar'], ['tarefas', 'Tarefas', 'check'], ['demandas', 'Demandas', 'message'], ['equipe', 'Equipe', 'users'], ['relatorios', 'Relatórios', 'chart'], ['configuracoes', 'Configurações', 'settings']];
const PATHS = { home: 'M3 10 12 3l9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10 M9 21v-8h6v8', columns: 'M3 4h18v16H3z M9 4v16 M15 4v16', building: 'M5 21V3h14v18 M3 21h18 M9 7h1 M14 7h1 M9 11h1 M14 11h1 M10 21v-6h4v6', calendar: 'M3 5h18v16H3z M7 3v4 M17 3v4 M3 10h18 M7 14h2 M13 14h2 M7 18h2', check: 'M4 4h16v16H4z M8 12l3 3 5-6', message: 'M3 4h18v14H8l-5 3V4 M7 8h10 M7 12h7', users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-4', chart: 'M4 3v18h18 M8 17v-5 M13 17V7 M18 17v-8', settings: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z', refresh: 'M20 11a8 8 0 1 0-2.3 5.7 M20 4v7h-7' };

/* ---------- Utilidades ---------- */
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${PATHS[n] || PATHS.building}"/></svg>`;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const agora = () => { const d = new Date(); return `${hoje()}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const somarDias = (iso, n) => { const d = new Date(iso.slice(0, 10) + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dia = v => v ? String(v).slice(0, 10) : '';
const hora = v => String(v || '').length > 10 ? String(v).slice(11, 16) : '';
const data = v => v && /^\d{4}-\d{2}-\d{2}/.test(v) ? new Date(dia(v) + 'T12:00:00').toLocaleDateString('pt-BR') : (v ? esc(v) : '—');
const dataHora = v => v ? data(v) + (hora(v) ? ' · ' + hora(v) : '') : '—';
const curta = v => v ? new Date(dia(v) + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) : 'Sem data';
const dinheiro = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const iniciais = v => String(v || '?').split(' ').filter(Boolean).map(s => s[0]).slice(0, 2).join('').toUpperCase();
const sim = v => v === true || /^(true|sim|1)$/i.test(String(v));
const norm = v => String(v || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

/* ---------- Estado ---------- */
let token = store.get(TOKEN_KEY) || '';
let D = null; // { usuario, tabelas, listas, config, planilha }
let page = 'inicio', view = 'kanban', query = '', owner = '', statusFilter = '', detailId = null, detailTab = 0, dragId = null;
let mes = new Date().getMonth(), ano = new Date().getFullYear(), ocupado = false;
const $ = id => document.getElementById(id);
const main = $('main'), detail = $('detail-dialog'), formDialog = $('form-dialog');

/* ---------- Acesso aos dados ---------- */
const T = nome => (D && D.tabelas[nome]) || [];
const L = cat => (D && D.listas[cat]) || [];
const cfg = (k, p) => { const v = D && D.config[k] && Number(D.config[k].valor); return v > 0 ? v : p; };
const eu = () => D ? D.usuario : null;
const usuarios = () => T('USUARIOS');
const ativos = () => usuarios().filter(u => sim(u.ATIVO));
const nomeUsuario = id => (usuarios().find(u => u.ID_USUARIO === id) || {}).NOME || (id ? id : '—');
const escola = id => T('ESCOLAS').find(e => e.ID_ESCOLA === id);
const oportunidadeDe = id => T('OPORTUNIDADES').filter(o => o.ID_ESCOLA === id).slice(-1)[0];
const contatosDe = id => T('CONTATOS').filter(c => c.ID_ESCOLA === id);
const principal = id => { const cs = contatosDe(id).filter(c => sim(c.ATIVO) || c.ATIVO === ''); return cs.find(c => sim(c.CONTATO_PRINCIPAL)) || cs[0]; };
const encerrada = o => o && ['Ganho', 'Perdido'].includes(o.STATUS);
const leads = () => T('OPORTUNIDADES').filter(o => !encerrada(o) && escola(o.ID_ESCOLA));
const perdidas = () => T('OPORTUNIDADES').filter(o => o.STATUS === 'Perdido');
const clientes = () => T('ESCOLAS').filter(e => e.STATUS_GERAL === 'Cliente');
const contratosDe = id => T('CONTRATOS').filter(c => c.ID_ESCOLA === id);
const kitsDoContrato = id => T('KITS_CONTRATADOS').filter(k => k.ID_CONTRATO === id);
const valorKits = ks => ks.reduce((a, k) => a + Number(k.VALOR_REFERENCIA || 0) * Number(k.QUANTIDADE_CONTRATADA || 0), 0);
const maxTent = () => cfg('MAX_TENTATIVAS_PRE', 7);

/* ---------- Comunicação com o Apps Script ---------- */
async function api(acao, dados = {}) {
  if (!API_URL) throw new Error('O endereço da API ainda não foi configurado nesta página.');
  let resp;
  try {
    resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao, dados, token }), redirect: 'follow' });
  } catch {
    throw new Error('Não foi possível falar com o servidor. Confira sua internet e tente de novo.');
  }
  let json;
  try { json = await resp.json(); } catch { throw new Error('Resposta inesperada do servidor. Confira se a implantação do Apps Script está como "Qualquer pessoa".'); }
  if (!json.ok) {
    if (json.codigo === 'SESSAO') { sair(true); }
    if (json.codigo === 'TROCAR_SENHA') { telaSenha(true); }
    const e = new Error(json.erro || 'Erro desconhecido.'); e.codigo = json.codigo; throw e;
  }
  return json.resultado;
}
const IDS = { ESCOLAS: 'ID_ESCOLA', CONTATOS: 'ID_CONTATO', OPORTUNIDADES: 'ID_OPORTUNIDADE', ATIVIDADES: 'ID_ATIVIDADE', TAREFAS: 'ID_TAREFA', REUNIOES: 'ID_REUNIAO', CONTRATACOES: 'ID_CONTRATACAO', CONTRATOS: 'ID_CONTRATO', ANOS_LETIVOS: 'ID_ANO_LETIVO', RENOVACOES: 'ID_RENOVACAO', KITS_CONTRATADOS: 'ID_ITEM', PEDAGOGICO: 'ID_PEDAGOGICO', DEMANDAS: 'ID_DEMANDA', MENSAGENS: 'ID_MENSAGEM', DOCUMENTOS: 'ID_DOCUMENTO', USUARIOS: 'ID_USUARIO', HABILITACOES: 'ID_HABILITACAO', HISTORICO: 'ID_HISTORICO', CHECKLIST: 'ID_ITEM_CHECK', CHECKLIST_ETAPAS: 'ID_ETAPA' };
/** Junta na memória da tela só os registros que o servidor devolveu. */
function aplicarMudancas(m) {
  if (!m || !D) return;
  Object.entries(m).forEach(([nome, linhas]) => {
    const chave = IDS[nome], tab = D.tabelas[nome] = D.tabelas[nome] || [];
    linhas.forEach(l => { const i = tab.findIndex(x => x[chave] === l[chave]); if (i >= 0) tab[i] = l; else tab.push(l); });
    if (nome === 'HISTORICO' && tab.length > 400) tab.splice(0, tab.length - 400);
  });
  if (m.USUARIOS) { const u = m.USUARIOS.find(x => x.ID_USUARIO === eu().id); if (u) Object.assign(D.usuario, { nome: u.NOME, perfil: u.PERFIL_PERMISSAO }); }
}
/** Redesenha sem tirar o foco de quem está digitando na busca. */
function redesenhar() {
  const ae = document.activeElement, id = ae && ae.id, pos = ae && ae.selectionStart;
  render(); if (detail.open) renderDetail();
  if (id && (id === 'page-search' || id === 'global-search')) { const el = $(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
}
async function gravar(acao, dados, msg) {
  setOcupado(true);
  try {
    const r = await api(acao, dados);
    aplicarMudancas(r.mudancas); redesenhar();
    if (msg) toast(msg);
    return r.resultado;
  } finally { setOcupado(false); }
}

/* ---------- Gravação em segundo plano (ações simples) ----------
   A tela muda na hora; o pedido entra numa fila e é enviado em ordem.
   Se a planilha recusar, a mudança é desfeita na tela e aparece um aviso. */
const fila = []; let enviandoFila = false;
function emSegundoPlano(descricao, aplicarLocal, acao, dados, msg) {
  const r = aplicarLocal(), desfazer = typeof r === 'function' ? r : r.desfazer, limpar = typeof r === 'function' ? null : r.limpar;
  redesenhar(); if (msg) toast(msg);
  fila.push({ descricao, desfazer, limpar, acao, dados });
  atualizarSync(); processarFila();
}
async function processarFila() {
  if (enviandoFila) return; enviandoFila = true;
  while (fila.length) {
    const item = fila[0];
    try { const r = await api(item.acao, item.dados); if (item.limpar) item.limpar(); aplicarMudancas(r.mudancas); }
    catch (err) {
      if (err.codigo === 'SESSAO') { fila.length = 0; break; }
      try { item.desfazer(); } catch {}
      toast(`Não foi salvo (${item.descricao}): ${err.message}`, true);
    }
    fila.shift(); atualizarSync(); redesenhar();
  }
  enviandoFila = false; atualizarSync();
}
function atualizarSync() {
  const s = $('sync-status'); if (!s) return;
  const n = fila.length + (ocupado ? 1 : 0);
  document.body.classList.toggle('busy', n > 0);
  s.textContent = n ? (fila.length ? `Salvando ${fila.length}…` : 'Sincronizando…') : 'Tudo salvo';
}
addEventListener('beforeunload', e => { if (fila.length) { e.preventDefault(); e.returnValue = ''; } });
const salvar = (tabela, registro, msg = 'Salvo na planilha.') => gravar('salvar', { tabela, registro }, msg);
async function recarregar(msg) {
  if (fila.length) return; // espera a fila terminar para não sobrescrever a tela
  setOcupado(true);
  try { D = await api('carregar'); redesenhar(); if (msg) toast(msg); }
  catch (e) { if (e.codigo !== 'SESSAO' && e.codigo !== 'TROCAR_SENHA') toast(e.message); }
  finally { setOcupado(false); }
}
function setOcupado(v) { ocupado = v; atualizarSync(); }

/* ---------- Login / senha ---------- */
function telaLogin(msg = '', emailDigitado = '') {
  document.body.classList.add('auth');
  $('auth').innerHTML = `<form class="auth-card" id="login-form" novalidate>
    <div class="brand"><span class="brand-mark">a</span><span>alicerces<small>CRM EDITORIAL</small></span></div>
    <h1>Entrar</h1><p class="subtitle">Use o e-mail cadastrado pela gestão.</p>
    ${API_URL ? '' : '<div class="notice">Esta página ainda não está ligada ao Apps Script. Fale com a administradora do CRM.</div>'}
    <label class="field">E-mail<input type="email" name="email" autocomplete="username" required value="${esc(emailDigitado || store.get('crm-alicerces-email') || '')}"></label>
    <label class="field">Senha<input type="password" name="senha" autocomplete="current-password" required></label>
    <p class="form-error" role="alert">${esc(msg)}</p>
    <button class="button" type="submit">Entrar</button>
    <p class="visual-tip">Primeiro acesso? Use a senha provisória que você recebeu. Em seguida o sistema pede para você criar a sua.</p>
  </form>`;
  const f = $('login-form');
  f.querySelector(msg ? '[name=senha]' : (f.email.value ? '[name=senha]' : '[name=email]')).focus();
  f.onsubmit = async e => {
    e.preventDefault();
    if (!f.reportValidity()) return;
    const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Entrando…';
    try {
      const r = await api('login', { email: f.email.value.trim(), senha: f.senha.value });
      token = r.token; store.set(TOKEN_KEY, token); store.set('crm-alicerces-email', f.email.value.trim());
      if (r.trocarSenha) telaSenha(true); else iniciar();
    } catch (err) { telaLogin(err.message, f.email.value.trim()); }
  };
}
function telaSenha(obrigatoria) {
  const html = `<form class="${obrigatoria ? 'auth-card' : 'form-body'}" id="senha-form">
    ${obrigatoria ? '<div class="brand"><span class="brand-mark">a</span><span>alicerces<small>CRM EDITORIAL</small></span></div><h1>Crie sua senha</h1><p class="subtitle">Você entrou com a senha provisória. Agora escolha uma senha só sua.</p>' : ''}
    <label class="field">Senha atual${obrigatoria ? ' (provisória)' : ''}<input type="password" name="senhaAtual" required autocomplete="current-password"></label>
    <label class="field">Nova senha (mínimo 8 caracteres)<input type="password" name="novaSenha" minlength="8" required autocomplete="new-password"></label>
    <label class="field">Repita a nova senha<input type="password" name="confirma" minlength="8" required autocomplete="new-password"></label>
    <p class="form-error" role="alert"></p>
    <div class="form-actions">${obrigatoria ? btn('Sair', 'logout', 'secondary', 'type="button"') : btn('Cancelar', 'close-form', 'secondary', 'type="button"')}<button class="button" type="submit">Salvar senha</button></div>
  </form>`;
  if (obrigatoria) { document.body.classList.add('auth'); $('auth').innerHTML = html; }
  else { $('form-content').innerHTML = `<div class="dialog-head"><h2 id="form-title">Alterar minha senha</h2><button type="button" class="icon-button" data-action="close-form" aria-label="Fechar">×</button></div>${html}`; formDialog.showModal(); }
  const f = $('senha-form');
  f.onsubmit = async e => {
    e.preventDefault();
    const erro = f.querySelector('.form-error');
    if (!f.reportValidity()) return;
    if (f.novaSenha.value !== f.confirma.value) { erro.textContent = 'As duas senhas novas não são iguais.'; return; }
    const b = f.querySelector('[type=submit]'); b.disabled = true;
    try {
      await api('alterarSenha', { senhaAtual: f.senhaAtual.value, novaSenha: f.novaSenha.value });
      if (obrigatoria) iniciar(); else { formDialog.close(); toast('Senha alterada.'); }
    } catch (err) { erro.textContent = err.message; b.disabled = false; }
  };
}
async function sair(expirou) {
  if (!expirou && token) { try { await api('sair'); } catch {} }
  token = ''; D = null; store.del(TOKEN_KEY);
  if (detail.open) detail.close(); if (formDialog.open) formDialog.close();
  telaLogin(expirou ? 'Sua sessão expirou. Entre novamente.' : '');
}
async function iniciar() {
  document.body.classList.add('auth');
  $('auth').innerHTML = '<div class="auth-card"><div class="brand"><span class="brand-mark">a</span><span>alicerces<small>CRM EDITORIAL</small></span></div><p class="subtitle">Carregando dados da planilha…</p></div>';
  try {

/* ---------- Componentes ---------- */
function toast(text, erro = false) { const t = $('toast'); t.textContent = text; t.classList.toggle('erro', erro); t.classList.add('visible'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('visible'), erro ? 9000 : 3500); }
const badge = (t, c = 'teal') => `<span class="pill ${c}">${esc(t)}</span>`;
const heading = (k, t, s, a = '') => `<div class="page-heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="subtitle">${s}</p></div><div class="heading-actions">${a}</div></div>`;

const campo = (rotulo, nome, tipo = 'text', valor = '', req = false, extra = '') => `<label class="field">${rotulo}${req ? ' *' : ''}<input type="${tipo}" name="${nome}" value="${esc(valor)}" ${req ? 'required' : ''} ${extra}></label>`;

const multipla = (rotulo, nome, opcoes, valor) => { const sel = String(valor || '').split(',').map(s => s.trim()); return `<fieldset class="field multi"><legend>${rotulo}</legend>${opcoes.map(o => `<label class="check-field"><input type="checkbox" data-multi="${nome}" value="${esc(o)}" ${sel.includes(o) ? 'checked' : ''}> ${esc(o)}</label>`).join('')}</fieldset>`; };
const linha = (...cols) => `<div class="form-row">${cols.join('')}</div>`;
const vazio = t => `<div class="empty">${t}</div>`;

function showForm(titulo, corpo, onSubmit, rotulo = 'Salvar') {
  $('form-content').innerHTML = `<div class="dialog-head"><h2 id="form-title">${titulo}</h2><button type="button" class="icon-button" data-action="close-form" aria-label="Fechar formulário">×</button></div><form class="form-body" id="active-form" novalidate>${corpo}<p class="form-error" role="alert"></p><div class="form-actions">${btn('Cancelar', 'close-form', 'secondary', 'type="button"')}<button type="submit" class="button">${rotulo}</button></div></form>`;
  const f = $('active-form');
  f.onsubmit = async e => {
    e.preventDefault();
    if (!f.reportValidity()) return;
    const v = {};
    new FormData(f).forEach((val, k) => { if (!f.querySelector(`[name="${k}"][data-bool]`)) v[k] = typeof val === 'string' ? val.trim() : val; });
    f.querySelectorAll('[data-bool]').forEach(c => { v[c.name] = c.checked; });
    const multi = {}; f.querySelectorAll('[data-multi]').forEach(c => { multi[c.dataset.multi] = multi[c.dataset.multi] || []; if (c.checked) multi[c.dataset.multi].push(c.value); });
    Object.entries(multi).forEach(([k, arr]) => { v[k] = arr.join(', '); });
    const b = f.querySelector('[type=submit]'), erro = f.querySelector('.form-error');
    b.disabled = true; b.textContent = 'Salvando…'; erro.textContent = '';
    try { const r = await onSubmit(v, f); if (r !== false) formDialog.close(); }
    catch (err) { erro.textContent = err.message; }
    finally { b.disabled = false; b.textContent = rotulo; }
  };
  if (!formDialog.open) formDialog.showModal();
  const primeiro = f.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); if (primeiro) primeiro.focus();
}

/* ---------- Prospecção ---------- */

  return heading('DO PRIMEIRO OLÁ À PARCERIA', 'Prospecção', 'Acompanhe cada conversa e transforme interesse em conexão.', (eu().gestor ? btn('⬆ Importar', 'import', 'secondary', 'data-tipo="PROSPECCAO"') : '') + btn('+ Nova escola', 'new-school')) + filtros(statusFilter !== 'perdidas', extra) + (view === 'list' || statusFilter === 'perdidas' ? tabela : kanban);

function cardLead(o) {

/* ---------- Checklists ---------- */
const itensCk = (idCtc, proc) => T('CHECKLIST').filter(c => c.ID_CONTRATACAO === idCtc && c.PROCESSO === proc).sort((a, b) => Number(a.ORDEM) - Number(b.ORDEM));

function progressoCk(itens) { const f = itens.filter(ckFeito).length; return { f, t: itens.length, pct: itens.length ? f / itens.length * 100 : 0 }; }
function checklistHtml(itens) {

function marcarCk(id, acao, botao) {
  const c = T('CHECKLIST').find(x => x.ID_ITEM_CHECK === id); if (!c) return;
  if (acao === 'reabrir') {
    if (!(c.CONCLUIDO_POR === eu().id || eu().gestor)) { toast('Só quem marcou (ou um gestor) pode desmarcar.', true); return; }
    if (!confirmar(botao, '↺')) { toast('Clique de novo na caixinha para desmarcar “' + c.NOME + '”.'); return; }
  }
  emSegundoPlano('“' + c.NOME + '”', () => {
    const antes = { STATUS: c.STATUS, CONCLUIDO_EM: c.CONCLUIDO_EM, CONCLUIDO_POR: c.CONCLUIDO_POR };

    else Object.assign(c, { STATUS: acao === 'concluir' ? 'Concluído' : 'Não se aplica', CONCLUIDO_EM: agora(), CONCLUIDO_POR: eu().id });
    return () => Object.assign(c, antes);
  }, 'marcarChecklist', { ID_ITEM_CHECK: id, acao }, acao === 'reabrir' ? 'Item desmarcado.' : (c.CHAVE === 'ASSINADO_CLIENTE' && acao === 'concluir' ? 'Assinado! Onboarding liberado para o pedagógico.' : 'Marcado.'));
}
/** Lista das tentativas de contato (máx. configurado), com o próximo passo pendente. */
function tentativasHtml(o) {
  const m = maxTent(), n = Number(o.TENTATIVAS_PRE_REUNIAO || 0), aberta = !encerrada(o), h = hoje();
  const ats = T('ATIVIDADES').filter(a => a.ID_OPORTUNIDADE === o.ID_OPORTUNIDADE).sort((a, b) => String(a.DATA_HORA).localeCompare(b.DATA_HORA));
  const reab = ats.map(a => a.TIPO_ATIVIDADE).lastIndexOf('Reabertura');
  const tent = ats.slice(reab + 1).filter(a => a.TIPO_ATIVIDADE === 'Tentativa de contato');
  const semReg = Math.max(0, n - tent.length);
  const linhas = Array.from({ length: m }, (_, k) => {
    const i = k + 1;
    if (i <= n) {
      const a = i <= semReg ? null : tent[i - semReg - 1];
      return `<li class="ck-item feito"><span class="ck-box" aria-hidden="true">✓</span><div class="ck-text"><strong>Tentativa ${i}${a && a.CANAL ? ' · ' + esc(a.CANAL) : ''}</strong><small>${a ? `${dataHora(a.DATA_HORA)} · ${esc(nomeUsuario(a.USUARIO))}${a.RESULTADO ? ' · ' + esc(a.RESULTADO) : ''}` : 'Registrada antes (importação)'}</small></div></li>`;
    }
    if (i === n + 1 && aberta) {
      const atras = o.PROXIMA_TENTATIVA && dia(o.PROXIMA_TENTATIVA) < h;
      return `<li class="ck-item atual ${atras ? 'atrasado' : ''}"><span class="ck-box" aria-hidden="true"></span><div class="ck-text"><strong>Tentativa ${i}</strong>${atras ? ' ' + badge('Atrasada', 'red') : ''}<small>${o.PROXIMA_TENTATIVA ? 'Prevista para ' + data(o.PROXIMA_TENTATIVA) : 'Pendente'} · marque pelo canal usado:</small><div class="ck-canais">${L('CANAL').map(c => btn(esc(c), 'tent-canal', 'secondary', `data-canal="${esc(c)}"`)).join('')}${btn('Com detalhes…', 'new-attempt', 'text')}</div></div></li>`;
    }
    return `<li class="ck-item futuro"><span class="ck-box" aria-hidden="true"></span><div class="ck-text"><strong>Tentativa ${i}</strong></div></li>`;
  });
  const fim = aberta && n >= m ? `<div class="notice" style="margin-top:12px">As ${m} tentativas foram feitas. Agende a apresentação pedagógica (aba Reuniões) ou registre “Não avançou”.</div>` : '';
  return `<section class="info-box"><h3>Tentativas de contato · ${n} de ${m}</h3><p class="secondary-text">Ao marcar uma tentativa, a próxima fica pendente para daqui a ${cfg('INTERVALO_TENTATIVAS_PRE_DIAS', 7)} dias.</p><ul class="ck">${linhas.join('')}</ul>${fim}</section>`;
}
function registrarTentativaRapida(o, canal) {
  const n = Number(o.TENTATIVAS_PRE_REUNIAO || 0); if (n >= maxTent()) return;
  const tmp = { ID_ATIVIDADE: 'tmp-' + Date.now(), ID_ESCOLA: o.ID_ESCOLA, ID_OPORTUNIDADE: o.ID_OPORTUNIDADE, TIPO_ATIVIDADE: 'Tentativa de contato', CANAL: canal, DATA_HORA: agora(), USUARIO: eu().id, RESULTADO: '', DESCRICAO: '' };
  emSegundoPlano('tentativa ' + (n + 1), () => {
    const antes = { TENTATIVAS_PRE_REUNIAO: o.TENTATIVAS_PRE_REUNIAO, DATA_ULTIMA_TENTATIVA: o.DATA_ULTIMA_TENTATIVA, PROXIMA_TENTATIVA: o.PROXIMA_TENTATIVA };
    Object.assign(o, { TENTATIVAS_PRE_REUNIAO: n + 1, DATA_ULTIMA_TENTATIVA: hoje(), PROXIMA_TENTATIVA: somarDias(hoje(), cfg('INTERVALO_TENTATIVAS_PRE_DIAS', 7)) });
    D.tabelas.ATIVIDADES.push(tmp);
    const tirarTmp = () => { const i = D.tabelas.ATIVIDADES.indexOf(tmp); if (i >= 0) D.tabelas.ATIVIDADES.splice(i, 1); };
    return { desfazer: () => { Object.assign(o, antes); tirarTmp(); }, limpar: tirarTmp };
  }, 'registrarTentativa', { ID_OPORTUNIDADE: o.ID_OPORTUNIDADE, CANAL: canal, DATA_HORA: tmp.DATA_HORA }, `Tentativa ${n + 1} registrada (${canal}).`);
}

async function moverEtapa(proc, pos, dir) {

      <label class="field">Arquivo (.xlsx ou .csv)<input type="file" id="imp-arquivo" accept=".xlsx,.xls,.csv"></label>
      <p class="visual-tip">Use a primeira linha para os títulos das colunas, exatamente como no modelo. Se o arquivo tiver várias abas, o sistema usa a aba com o nome ${esc(imp.tipo)} (ou a primeira aba).</p>
      <p class="form-error" role="alert">${esc(erro)}</p><div class="form-actions">${btn('Cancelar', 'close-form', 'secondary', 'type="button"')}</div>`;
  } else {
    const r = imp.previa, cont = s => r.filter(x => x.status === s).length, okN = cont('ok');
    const problemas = r.filter(x => x.status !== 'ok');
    corpo = `<div class="notice"><strong>${esc(imp.arquivo)}</strong>${imp.aba ? ' · aba ' + esc(imp.aba) : ''} · ${r.length} linha(s) lida(s)${imp.ignoradas.length ? `<br>Colunas ignoradas (nome diferente do modelo): ${esc(imp.ignoradas.join(', '))}` : ''}</div>

      ${problemas.length ? `<h3 style="margin-top:20px">Linhas que não serão importadas</h3><div class="table-wrap imp-table"><table><thead><tr><th>LINHA</th><th>ESCOLA / ITEM</th><th>MOTIVO</th></tr></thead><tbody>${problemas.map(x => `<tr><td>${x.linha}</td><td>${esc(x.nome)}</td><td>${badge(x.status === 'erro' ? 'Erro' : 'Já existe', x.status === 'erro' ? 'red' : 'orange')} ${esc(x.mensagem)}</td></tr>`).join('')}</tbody></table></div><p class="visual-tip">Você pode importar as linhas prontas agora e corrigir as outras depois, num novo arquivo: as que já entraram serão reconhecidas como “já existem”.</p>` : ''}

  }

  if (!formDialog.open) formDialog.showModal();

  const arq = $('imp-arquivo'); if (arq) arq.onchange = () => arq.files[0] && lerArquivo(arq.files[0]);
}
async function lerArquivo(file) {
  const corpo = $('imp-body'); corpo.insertAdjacentHTML('beforeend', '<p class="visual-tip" id="imp-status">Lendo o arquivo…</p>');
  try {
    const XLSX = await carregarXlsx();
    const buf = await file.arrayBuffer();
    let wb;
    if (/\.csv$/i.test(file.name)) {
      let txt; try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { txt = new TextDecoder('windows-1252').decode(buf); } // Excel salva CSV em ANSI
      wb = XLSX.read(txt.replace(/^\ufeff/, ''), { type: 'string', cellDates: true, raw: true });
    } else wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const nome = wb.SheetNames.find(n => cabNorm(n) === imp.tipo) || wb.SheetNames.find(n => !/INSTRU/i.test(n)) || wb.SheetNames[0];
    const matriz = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: '' });
    if (!matriz.length) throw new Error('A aba “' + nome + '” está vazia.');
    const def = IMPORT[imp.tipo], conhecidas = def.colunas.map(c => c[0]);
    const cab = matriz[0].map(cabNorm);
    const faltam = def.colunas.filter(c => c[2] && !cab.includes(c[0])).map(c => c[0]);
    if (imp.tipo === 'KITS' && !cab.includes('CNPJ') && !(cab.includes('NOME_ESCOLA') && cab.includes('CIDADE'))) faltam.push('CNPJ (ou NOME_ESCOLA + CIDADE)');
    if (faltam.length) throw new Error('Faltam colunas obrigatórias na aba “' + nome + '”: ' + faltam.join(', ') + '. Confira se a primeira linha tem os títulos do modelo.');
    const linhas = [];
    matriz.slice(1).forEach((row, i) => {
      const o = { _linha: i + 2 }; let algum = false;
      cab.forEach((c, j) => { if (conhecidas.includes(c)) { const v = normValor(c, row[j]); if (v !== '') { o[c] = v; algum = true; } } });
      if (algum) linhas.push(o);
    });
    if (!linhas.length) throw new Error('Nenhuma linha preenchida abaixo dos títulos.');
    if (linhas.length > 2000) throw new Error('O arquivo tem ' + linhas.length + ' linhas. Divida em arquivos de até 2.000 linhas.');
    imp.arquivo = file.name; imp.aba = wb.SheetNames.length > 1 ? nome : ''; imp.linhas = linhas;
    imp.ignoradas = matriz[0].filter((h, j) => String(h).trim() && !conhecidas.includes(cab[j])).map(String);
    imp.lote = 'IMP-' + hoje().replace(/-/g, '') + '-' + pad(new Date().getHours()) + pad(new Date().getMinutes()) + '-' + imp.tipo.slice(0, 3);
    $('imp-status').textContent = `Conferindo ${linhas.length} linha(s) com a planilha do CRM…`;
    imp.previa = [];
    for (let i = 0; i < linhas.length; i += 200) {
      const r = await api('importar', { tipo: imp.tipo, linhas: linhas.slice(i, i + 200), confirmar: false, lote: imp.lote });
      imp.previa.push(...r.resultado);
    }
    telaImportacao();
  } catch (err) { imp.previa = null; telaImportacao(err.message); }
}
async function confirmarImportacao() {
  const okLinhas = new Set(imp.previa.filter(x => x.status === 'ok').map(x => x.linha));
  const enviar = imp.linhas.filter(l => okLinhas.has(l._linha));
  const b = $('imp-confirmar'); b.disabled = true;
  document.querySelectorAll('#imp-body [data-action=imp-voltar],[data-action=close-form]').forEach(x => { x.disabled = true; });
  setOcupado(true);
  let gravadas = 0; const falhas = [];
  try {
    for (let i = 0; i < enviar.length; i += 100) {
      b.textContent = `Gravando ${Math.min(i + 100, enviar.length)} de ${enviar.length}…`;
      const r = await api('importar', { tipo: imp.tipo, linhas: enviar.slice(i, i + 100), confirmar: true, lote: imp.lote });
      gravadas += r.gravadas; falhas.push(...r.resultado.filter(x => x.status !== 'ok'));
    }
  } catch (err) {
    falhas.push({ linha: '—', nome: '', status: 'erro', mensagem: 'Interrompido: ' + err.message + ' As linhas já gravadas ficam no CRM; reenvie o arquivo para importar o restante.' });
  } finally { setOcupado(false); }
  await recarregar();
  $('form-content').innerHTML = `<div class="dialog-head"><h2 id="form-title">Importação concluída</h2><button type="button" class="icon-button" data-action="close-form" aria-label="Fechar">×</button></div><div class="form-body"><div class="stat"><div class="stat-top">Linhas importadas</div><div class="stat-value">${gravadas}</div><div class="stat-note">Lote ${esc(imp.lote)} · registrado no histórico</div></div>${falhas.length ? `<h3 style="margin-top:20px">Não importadas nesta etapa</h3><div class="table-wrap imp-table"><table><tbody>${falhas.map(x => `<tr><td>${x.linha}</td><td>${esc(x.nome)}</td><td>${esc(x.mensagem)}</td></tr>`).join('')}</tbody></table></div>` : ''}<div class="form-actions">${btn('Importar outro arquivo', 'imp-novo', 'secondary', 'type="button"')}${btn('Concluir', 'close-form', '', 'type="button"')}</div></div>`;
}
async function baixarModelo() {
  try {
    const XLSX = await carregarXlsx(), wb = XLSX.utils.book_new();
    const instr = [['CRM ALICERCES · MODELO DE IMPORTAÇÃO'], ['Preencha uma linha por escola (ou por kit, na aba KITS). Não altere os títulos da primeira linha. Datas no formato dd/mm/aaaa.'], ['Importe na ordem: PROSPECCAO e CLIENTES; depois KITS.'], [], ['ABA', 'COLUNA', 'OBRIGATÓRIA', 'O QUE PREENCHER', 'EXEMPLO']];
    Object.entries(IMPORT).forEach(([k, d]) => d.colunas.forEach(c => instr.push([k, c[0], c[2] ? 'Sim' : '', c[1], c[3]])));
    instr.push([], ['LISTAS ATUAIS DO CRM']); Object.entries(D.listas).forEach(([k, v]) => instr.push([k, v.join(' · ')]));
    instr.push([], ['E-MAILS DA EQUIPE'], ...ativos().map(u => [u.NOME, u.EMAIL_GOOGLE]));
    const wsI = XLSX.utils.aoa_to_sheet(instr); wsI['!cols'] = [{ wch: 26 }, { wch: 30 }, { wch: 12 }, { wch: 80 }, { wch: 40 }];
    XLSX.utils.book_append_sheet(wb, wsI, 'INSTRUCOES');
    Object.entries(IMPORT).forEach(([k, d]) => { const ws = XLSX.utils.aoa_to_sheet([d.colunas.map(c => c[0])]); ws['!cols'] = d.colunas.map(c => ({ wch: Math.max(14, c[0].length + 2) })); XLSX.utils.book_append_sheet(wb, ws, k); });
    XLSX.writeFile(wb, 'modelo-importacao-crm-alicerces.xlsx');
  } catch (err) { toast(err.message); }
}

function confirmar(b, texto_) {
  if (b.dataset.confirm === '1') { b.dataset.confirm = ''; return true; }
  b.dataset.confirm = '1'; const orig = b.textContent; b.textContent = texto_;
  setTimeout(() => { b.dataset.confirm = ''; b.textContent = orig; }, 4000);
  return false;
}
