<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agendar reunião · Alicerces</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Escolha um horário para conversar com a equipe da Alicerces do Ensino.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2350B0A7'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3Ea%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--teal:#50B0A7;--teal-dark:#28766f;--orange:#F38932;--bg:#F4EFE8;--ink:#263b38;--muted:#6d7b75;--border:#e2e2d8;--soft:#eaf5f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',Arial,sans-serif}
h1,h2,h3{font-family:Manrope,Arial,sans-serif;margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 48px}
.brand{display:flex;align-items:center;gap:10px;font:800 24px Manrope,Arial;color:var(--teal-dark);letter-spacing:-1px;margin-bottom:22px}
.brand span{display:grid;place-items:center;width:34px;height:36px;background:var(--teal);color:#fff;border-radius:11px 11px 3px 11px;font-size:30px;line-height:1}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 6px 28px #263b380a;margin-bottom:18px}
.perfil{display:flex;gap:16px;align-items:center}.avatar{flex:0 0 58px;height:58px;border-radius:50%;background:var(--soft);color:var(--teal-dark);display:grid;place-items:center;font:800 20px Manrope,Arial,sans-serif}
.perfil h1{font-size:24px;letter-spacing:-.5px}.perfil p{margin:2px 0 0;color:var(--muted);font-size:14px}
.apres{margin:16px 0 0;color:#4d5d58;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.pill{background:var(--soft);color:var(--teal-dark);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.pill.orange{background:#fff0e3;color:#b86e30}
h2{font-size:17px;margin-bottom:14px}.passo{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;margin-right:8px;vertical-align:1px}
.tipos{display:flex;flex-wrap:wrap;gap:8px}.tipo{border:1.5px solid #cfe3dd;background:#fff;color:var(--teal-dark);border-radius:10px;padding:10px 14px;font-weight:600}
.tipo[aria-pressed=true]{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff}
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.dia{flex:0 0 auto;min-width:68px;background:#f3f4ee;color:#4f5f58;border:0;border-radius:12px;padding:8px 10px;text-align:center;font-weight:600;font-size:12px;line-height:1.3}
.dia b{display:block;font:800 18px Manrope,Arial,sans-serif}.dia[aria-pressed=true]{background:var(--teal);color:#fff}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:12px}
.hora{border:1.5px solid #cfe3dd;background:#fff;color:var(--teal-dark);border-radius:10px;padding:10px 0;font-weight:700}
.hora:hover{background:var(--soft)}.hora[aria-pressed=true]{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff}
.escolhido{margin-top:12px;font-size:13px;color:var(--muted)}.escolhido strong{color:var(--ink)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:14px}.campo{display:block;font-size:13px;font-weight:600}
.campo input,.campo textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #d6dccf;border-radius:10px;background:#fffefb;color:var(--ink)}
.campo textarea{min-height:80px;resize:vertical}.campo.full{grid-column:1/-1}.campo small{font-weight:400;color:var(--muted)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.armadilha{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.enviar{width:100%;margin-top:18px;background:var(--orange);color:#fff;border:0;border-radius:12px;padding:14px;font:800 16px Manrope,Arial,sans-serif}
.enviar:disabled{opacity:.55;cursor:not-allowed}
.erro{background:#fbe8e5;color:#a53d35;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px}
.vazio{color:var(--muted);text-align:center;padding:24px}.carregando{color:var(--muted);padding:16px 0}
.ok{text-align:center;padding:36px 24px}.ok .check{width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--teal-dark);display:grid;place-items:center;font-size:32px;margin:0 auto 14px}
.ok h1{font-size:26px;margin-bottom:8px}.ok p{color:#4d5d58;margin:6px 0}.ok a{color:var(--teal-dark);font-weight:700}
footer{text-align:center;color:#8d968e;font-size:12px;margin-top:20px}
@media(max-width:600px){.card{padding:18px}.grade{grid-template-columns:1fr}.perfil h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span>a</span>alicerces</div>
  <main id="app"><div class="card carregando">Carregando…</div></main>
  <footer>Alicerces do Ensino · horários no fuso de Brasília</footer>
</div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyrHkTuHg55wwhdwUVoHhtaxbfjg6X7ELdtbnontJ2Y3Z5egA9aADIa4tcj1e1gQ-Ip/exec';
  var slug = new URLSearchParams(location.search).get('c') || '';
  var app = document.getElementById('app');
  var st = { pagina: null, tipo: '', livres: [], dia: '', inicio: '', enviando: false };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(acao, dados) {
    return fetch(API, { method: 'POST', body: JSON.stringify({ acao: acao, dados: Object.assign({ c: slug }, dados || {}) }), redirect: 'follow' })
      .then(function (r) { return r.json().catch(function () { var e = new Error('RESPOSTA'); e.codigo = 'RESPOSTA_INVALIDA'; throw e; }); },
            function () { throw new Error('Sem conexão. Confira sua internet e tente de novo.'); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.erro || 'Erro.'); e.codigo = j.codigo; throw e; } return j.resultado; });
  }
  var DS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], MS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function partes(iso) { var d = new Date(iso.slice(0, 10) + 'T12:00:00'); return { sem: DS[d.getDay()], dia: d.getDate(), mes: MS[d.getMonth()] }; }
  function rotulo(iso) { var p = partes(iso); return p.sem + ', ' + p.dia + ' de ' + p.mes + ' às ' + iso.slice(11, 16); }
  function iniciais(n) { return String(n || '').split(' ').filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase(); }

  function erroGeral(msg) { app.innerHTML = '<div class="card vazio">' + esc(msg) + '</div>'; }
  function carregarHorarios() {
    var box = document.getElementById('slots'); if (box) box.innerHTML = '<p class="carregando">Buscando horários livres…</p>';
    return api('publicoHorarios').then(function (r) { st.livres = r.livres; if (st.inicio && st.livres.indexOf(st.inicio) < 0) st.inicio = ''; desenharSlots(); })
      .catch(function (e) { if (box) box.innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; });
  }
  function desenharSlots() {
    var box = document.getElementById('slots'); if (!box) return;
    var porDia = {}; st.livres.forEach(function (h) { (porDia[h.slice(0, 10)] = porDia[h.slice(0, 10)] || []).push(h); });
    var dias = Object.keys(porDia);
    if (!dias.length) { box.innerHTML = '<p class="vazio">Não há horários livres no momento. Tente novamente mais tarde.</p>'; atualizarBotao(); return; }
    if (!porDia[st.dia]) st.dia = st.inicio ? st.inicio.slice(0, 10) : dias[0];
    box.innerHTML = '<div class="dias" role="group" aria-label="Dia">' + dias.map(function (d) { var p = partes(d + 'T00:00'); return '<button type="button" class="dia" data-dia="' + d + '" aria-pressed="' + (d === st.dia) + '">' + p.sem + '<b>' + p.dia + '</b>' + p.mes + '</button>'; }).join('') + '</div>'
      + '<div class="horas" role="group" aria-label="Horário">' + porDia[st.dia].map(function (h) { return '<button type="button" class="hora" data-hora="' + h + '" aria-pressed="' + (h === st.inicio) + '">' + h.slice(11, 16) + '</button>'; }).join('') + '</div>'
      + '<p class="escolhido">' + (st.inicio ? '✓ <strong>' + esc(rotulo(st.inicio)) + '</strong> · ' + st.pagina.duracao + ' min' : 'Escolha o dia e o horário.') + '</p>';
    atualizarBotao();
  }
  function atualizarBotao() { var b = document.getElementById('enviar'); if (b) b.disabled = !st.inicio || !st.tipo || st.enviando; }
  function desenhar() {
    var p = st.pagina;
    app.innerHTML = '<section class="card"><div class="perfil"><div class="avatar">' + esc(iniciais(p.nome)) + '</div><div><h1>' + esc(p.nome) + '</h1><p>' + esc([p.cargo, 'Alicerces do Ensino'].filter(Boolean).join(' · ')) + '</p></div></div>'
      + (p.apresentacao ? '<p class="apres">' + esc(p.apresentacao) + '</p>' : '')
      + '<div class="meta"><span class="pill">🎥 Online pelo Google Meet</span><span class="pill">⏱ ' + p.duracao + ' minutos</span><span class="pill orange">📩 Convite por e-mail</span></div></section>'
      + (p.tipos.length > 1 ? '<section class="card"><h2><span class="passo">1</span>Sobre o que vamos conversar?</h2><div class="tipos" role="group">' + p.tipos.map(function (t) { return '<button type="button" class="tipo" data-tipo="' + esc(t) + '" aria-pressed="' + (t === st.tipo) + '">' + esc(t) + '</button>'; }).join('') + '</div></section>' : '')
      + '<section class="card"><h2><span class="passo">' + (p.tipos.length > 1 ? 2 : 1) + '</span>Escolha o dia e o horário</h2><div id="slots"><p class="carregando">Buscando horários livres…</p></div></section>'
      + '<form class="card" id="form" novalidate><h2><span class="passo">' + (p.tipos.length > 1 ? 3 : 2) + '</span>Seus dados</h2><div class="grade">'
      + '<label class="campo">Seu nome *<input name="NOME" required autocomplete="name" maxlength="120"></label>'
      + '<label class="campo">Cargo / função<input name="CARGO" autocomplete="organization-title" maxlength="80" placeholder="Ex.: Diretora, Coordenador"></label>'
      + '<label class="campo">E-mail * <small>(o convite chega aqui)</small><input name="EMAIL" type="email" required autocomplete="email" maxlength="120"></label>'
      + '<label class="campo">WhatsApp com DDD *<input name="TELEFONE" type="tel" required autocomplete="tel" maxlength="25" placeholder="(41) 99999-0000"></label>'
      + '<label class="campo full">Nome da escola *<input name="ESCOLA" required autocomplete="organization" maxlength="160"></label>'
      + '<label class="campo">Cidade *<input name="CIDADE" required maxlength="80" autocomplete="address-level2"></label>'
      + '<label class="campo">UF<input name="UF" maxlength="2" autocomplete="address-level1" placeholder="PR"></label>'
      + '<label class="campo full">Quer adiantar algum assunto? <small>(opcional)</small><textarea name="OBSERVACOES" maxlength="1000"></textarea></label>'
      + '<div class="armadilha" aria-hidden="true"><label>Site<input name="site" tabindex="-1" autocomplete="off"></label></div>'
      + '</div><div id="erro" class="erro" role="alert" hidden></div><button class="enviar" id="enviar" type="submit" disabled>Confirmar agendamento</button></form>';
    desenharSlots(); if (!st.livres.length) carregarHorarios();
  }
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.tipo) { st.tipo = b.dataset.tipo; app.querySelectorAll('.tipo').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); atualizarBotao(); }
    if (b.dataset.dia) { st.dia = b.dataset.dia; desenharSlots(); }
    if (b.dataset.hora) { st.inicio = b.dataset.hora; desenharSlots(); }
  });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target, erro = document.getElementById('erro'), b = document.getElementById('enviar');
    if (!f.reportValidity()) return;
    var dados = {}; new FormData(f).forEach(function (v, k) { dados[k] = String(v).trim(); });
    dados.TIPO = st.tipo; dados.INICIO = st.inicio;
    st.enviando = true; b.disabled = true; b.textContent = 'Agendando…'; erro.hidden = true;
    api('publicoAgendar', dados).then(function (r) {
      app.innerHTML = '<section class="card ok"><div class="check">✓</div><h1>Reunião agendada!</h1><p><strong>' + esc(rotulo(r.inicio)) + '</strong> (horário de Brasília) · ' + r.duracao + ' min</p><p>' + esc(r.tipo) + ' com ' + esc(r.consultor) + '</p>'
        + '<p>O convite com o link do Google Meet foi enviado para <strong>' + esc(r.email) + '</strong>. Se não aparecer na caixa de entrada, confira o spam.</p>'
        + (r.link ? '<p><a href="' + esc(r.link) + '" target="_blank" rel="noopener">Link da reunião (Meet)</a></p>' : '') + '<p style="margin-top:16px;color:#8d968e;font-size:13px">Precisa mudar o horário? Responda o convite ou fale com ' + esc(String(r.consultor).split(' ')[0]) + '.</p></section>';
      window.scrollTo(0, 0);
    }).catch(function (e) {
      st.enviando = false; b.textContent = 'Confirmar agendamento';
      if (e.codigo === 'RESPOSTA_INVALIDA') { erro.textContent = 'Não recebemos a confirmação. Confira seu e-mail em alguns minutos: se o convite chegou, está agendado. Se não chegou, tente de novo.'; }
      else erro.textContent = e.message;
      erro.hidden = false;
      if (e.codigo === 'HORARIO_OCUPADO') { st.inicio = ''; carregarHorarios(); }
      atualizarBotao();
    });
  });
  if (!API) return erroGeral('Página em configuração.');
  if (!slug) return erroGeral('Link de agendamento incompleto. Peça o link correto para a equipe da Alicerces.');
  api('publicoPagina').then(function (p) {
    st.pagina = p; st.tipo = p.tipos.length === 1 ? p.tipos[0] : '';
    document.title = 'Agendar com ' + p.nome + ' · Alicerces';
    desenhar();
  }).catch(function (e) { erroGeral(e.message); });
})();
</script>
</body>
</html>
